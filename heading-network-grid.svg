<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" fill="none">
  <defs>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" stroke="#0a5b78" stroke-opacity=".1" stroke-width="1"/>
    </pattern>
    <linearGradient id="horizontal">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset=".2" stop-color="white"/>
      <stop offset=".8" stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vertical" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset=".2" stop-color="white"/>
      <stop offset=".8" stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="fade-x"><rect width="600" height="350" fill="url(#horizontal)"/></mask>
    <mask id="fade-y"><rect width="600" height="350" fill="url(#vertical)"/></mask>
  </defs>
  <g mask="url(#fade-x)"><rect width="600" height="350" fill="url(#grid)" mask="url(#fade-y)"/></g>
</svg>
